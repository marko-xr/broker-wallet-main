plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id 'com.google.gms.google-services'
}

def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}
// Release signing needs android/key.properties (git-ignored) naming the
// upload keystore; see https://docs.flutter.dev/deployment/android#signing-the-app.
// Without it, AGP fails `validateSigningRelease`. Fall back to the debug key so
// local release builds still work, and say so loudly: such an APK or bundle
// must never be uploaded to a store.
def hasReleaseKeystore = keystoreProperties['storeFile'] != null
if (!hasReleaseKeystore) {
    // logger.quiet: flutter runs Gradle with -q, which hides warn-level output.
    logger.quiet("WARNING: android/key.properties with storeFile not found. " +
        "Release builds are signed with the DEBUG key for local testing only " +
        "and must not be uploaded to a store.")
}

android {
    namespace = "com.nmodigital.brokerwallet"
    // compileSdk and targetSdk are correctly set for Android 15+ compliance.
    compileSdk = 36
    
    // Recommended: Use NDK r29. It enables 16KB alignment by default.
    ndkVersion = "29.0.14206865"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    // kotlinOptions is the deprecated DSL; compilerOptions is its replacement.
    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
            freeCompilerArgs.add("-Xsuppress-version-warnings")
        }
    }

    defaultConfig {
        applicationId = "com.nmodigital.brokerwallet"
        minSdkVersion flutter.minSdkVersion
        // Google Play requires API 36 for new apps and updates since 31 August 2026.
        targetSdk = 36
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        multiDexEnabled true  // Add this for large apps
        ndk {
            // Includes only the 64-bit architectures
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    signingConfigs {
        release {
            if (keystoreProperties['storeFile'] != null) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            signingConfig hasReleaseKeystore ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }

    // Add this block to handle any potential packaging conflicts
    packagingOptions {
        pickFirst '/libc++_shared.so'
        pickFirst '/libjsc.so'
    }
}

flutter {
    source = "../.."
}

dependencies {
    // Import the Firebase BoM (Bill of Materials) - Updated for 16KB compliance
    implementation platform('com.google.firebase:firebase-bom:34.4.0')
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.android.gms:play-services-auth:21.2.0'  

    // Add multidex support for large apps
    implementation 'androidx.multidex:multidex:2.0.1'

    // FileProvider, which the native multi-media share subclasses. Already in
    // the build through share_plus at this version; named here so the app's own
    // code never depends on another library happening to expose it.
    implementation 'androidx.core:core:1.13.1'

    // Core library desugaring
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}
