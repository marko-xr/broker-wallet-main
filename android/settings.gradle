pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }

    // AGP 8.11.1 bundles an R8/D8 whose Kotlin metadata reader stops at 2.2.0,
    // so every class compiled with Kotlin 2.3 (kotlin-stdlib 2.3.10 via
    // android-maps-utils) prints "malformed kotlin.Metadata". Pinning a newer
    // R8 on the plugin classpath is the documented way to update it without
    // moving AGP: https://developer.android.com/build/shrink-code
    buildscript {
        dependencies {
            classpath "com.android.tools:r8:8.13.25"
        }
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.11.1" apply false
    // 2.3.x: android-maps-utils 4.1.0 (google_maps_flutter) brings kotlin-stdlib
    // 2.3.10 onto the classpath, and a 2.2 compiler reports every one of its
    // classes as "incompatible metadata 2.3.0". Flutter 3.47 templates 2.4.0.
    id "org.jetbrains.kotlin.android" version "2.3.10" apply false
    id "com.google.gms.google-services" version "4.4.2" apply false
}

include ":app"
