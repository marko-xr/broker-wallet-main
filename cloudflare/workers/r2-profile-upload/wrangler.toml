name = "r2-profile-upload"
main = "worker.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = true

# Private profile-image bucket. The MEDIA_BUCKET binding is used only by worker.js.
[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "broker-wallet-media"

# Required runtime configuration (set outside this file; never commit credentials):
# Public/non-sensitive: SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, R2_BUCKET_NAME,
# R2_S3_ENDPOINT, ALLOWED_ORIGIN.
# Server-only secrets: SUPABASE_SECRET_KEY, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY.
[vars]
SUPABASE_URL = "https://rbvcnvqpdqrhywcgxkne.supabase.co"
SUPABASE_PUBLISHABLE_KEY = "sb_publishable_zGvG-mwMCkcpjtTYcscv1A_Xec0qXZz"
R2_BUCKET_NAME = "broker-wallet-media"
R2_S3_ENDPOINT = "https://cb2f5eeef339651f8c7d94dd04866726.r2.cloudflarestorage.com"
ALLOWED_ORIGIN = "*"

[secrets]
required = [
  "SUPABASE_SECRET_KEY",
  "R2_ACCESS_KEY_ID",
  "R2_SECRET_ACCESS_KEY"
]