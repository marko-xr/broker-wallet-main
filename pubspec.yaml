  # rules and activating additional ones.
  flutter_lints: ^4.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/icons/markers/
    - lib/src/common/localization/app_en.arb
    - lib/src/common/localization/app_ar.arb
    - assets/fonts/Noto_Sans/static/NotoSans-Regular.ttf
    - assets/fonts/Noto_Sans/static/NotoSans-Bold.ttf
    - assets/fonts/Noto_Naskh_Arabic/static/NotoNaskhArabic-Regular.ttf
    - assets/fonts/Noto_Naskh_Arabic/static/NotoNaskhArabic-Bold.ttf
  


  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  fonts:
    - family: NotoNaskhArabic
      fonts:
        - asset: assets/fonts/Noto_Naskh_Arabic/NotoNaskhArabic-VariableFont_wght.ttf
          weight: 400
    - family: NotoNaskhArabicBold
      fonts:
        - asset: assets/fonts/Noto_Naskh_Arabic_Bold/NotoNaskhArabic-VariableFont_wght.ttf
          weight: 700
    - family: NotoSans
      fonts:
        - asset: assets/fonts/Noto_Sans/NotoSans-VariableFont_wdth,wght.ttf
          weight: 400
        - asset: assets/fonts/Noto_Sans/NotoSans-Italic-VariableFont_wdth,wght.ttf
          weight: 400
          style: italic
    - family: NotoSansBold
      fonts:
        - asset: assets/fonts/Noto_Sans_Bold/NotoSans-VariableFont_wdth,wght.ttf
          weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
